name: Pubblica e verifica l’aggiornamento Party 0.4.1
on:
  push:
    branches: [party-update-041]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepara il pacchetto completo e verifica la SHA-256
        run: |
          set -euo pipefail
          test "$(jq -r .sha256 party/manifest.json)" = '85bc23d50e6d0ee0aa9665c0601c7c9bb7532417ca4b13eb2822844513a88915'
          out="$RUNNER_TEMP/channel"
          mkdir -p "$out"
          cp party/85bc23d50e6d0ee0aa9665c0601c7c9bb7532417ca4b13eb2822844513a88915.json "$out/payload.json"
          cp party/README.md "$out/README.md"
          cd "$out"
          git init -q
          git apply "$GITHUB_WORKSPACE/update.patch"
          echo '7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9  payload.json' | sha256sum -c
          test "$(jq -r .version payload.json)" = '0.4.1'
          mv payload.json 7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9.json
          cp "$GITHUB_WORKSPACE/manifest-041.json" manifest.json
          test "$(jq -r .sha256 manifest.json)" = '7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9'
          cd "$GITHUB_WORKSPACE"
          git fetch origin main
          git switch --detach FETCH_HEAD
          test "$(jq -r .sha256 party/manifest.json)" = '85bc23d50e6d0ee0aa9665c0601c7c9bb7532417ca4b13eb2822844513a88915'
          cp "$out"/*.json "$out/README.md" party/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add party
          git commit -m 'Pubblica il pulsante aggiornamenti del Party 0.4.1'
          git push origin HEAD:main
      - name: Verifica il download con lo stesso indirizzo usato dall’app
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/party"
          for attempt in {1..12}; do
            if curl -fsSL "$url/manifest.json?check=$GITHUB_RUN_ID-$attempt" -o public.json && test "$(jq -r .sha256 public.json)" = '7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9'; then break; fi
            sleep 3
          done
          test "$(jq -r .sha256 public.json)" = '7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9'
          curl -fsSL --retry 5 --retry-all-errors "$url/7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9.json" -o public-payload.json
          echo '7e42667d406669b8abaa971001af96d8bc731c095856cb67aa0697c5e0ff13d9  public-payload.json' | sha256sum -c
